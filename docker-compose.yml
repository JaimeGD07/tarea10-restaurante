services:
  app:
    build:
      context: ./docker/php
    container_name: t10_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    networks:
      - t10_network
    depends_on:
      - db

  webserver:
    image: nginx:stable-alpine
    container_name: t10_webserver
    restart: unless-stopped
    ports:
      - "8010:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - t10_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: t10_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: restaurante_menu
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3310:3306"
    volumes:
      - t10_db_data:/var/lib/mysql
    networks:
      - t10_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: t10_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: laravel
      PMA_PASSWORD: laravel_pass
    ports:
      - "8081:80"
    networks:
      - t10_network
    depends_on:
      - db

networks:
  t10_network:
    driver: bridge

volumes:
  t10_db_data:
